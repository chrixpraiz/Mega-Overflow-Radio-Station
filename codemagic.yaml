workflows:
  flutter-android:
    name: MOR Flutter Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fix Flutter structure
        script: |
          ls -la
          # Create proper Flutter structure if main.dart at root
          if [ -f main.dart ]; then
            mkdir -p lib
            cp main.dart lib/main.dart
          fi
          if [ -f pubspec.yaml ]; then
            cat pubspec.yaml
          fi
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --debug --verbose
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/*.apk
