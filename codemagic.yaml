workflows:
  flutter-android:
    name: MOR Flutter - FORCED minSdk 23
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Fix Structure + FORCE minSdk 23
        script: |
          cp main.dart /tmp/my_main.dart || cp lib/main.dart /tmp/my_main.dart
          rm -rf android
          flutter create . --platforms=android --project-name megaoverflowradio
          cp /tmp/my_main.dart lib/main.dart
          mkdir -p assets/icon assets/images
          touch assets/icon/.keep assets/images/.keep
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
          
          echo "=== BEFORE ==="
          cat android/local.properties
          cat android/app/build.gradle | grep -i minsdk
          
          # FORCE 23 in local.properties
          sed -i '' 's/flutter.minSdkVersion=.*/flutter.minSdkVersion=23/' android/local.properties
          # If not exist, add it
          if ! grep -q "flutter.minSdkVersion" android/local.properties; then
            echo "flutter.minSdkVersion=23" >> android/local.properties
          fi
          
          # ALSO force in app/build.gradle directly to 23
          sed -i '' 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          sed -i '' 's/minSdk flutter.minSdkVersion/minSdk 23/' android/app/build.gradle
          sed -i '' 's/minSdkVersion 21/minSdkVersion 23/' android/app/build.gradle
          sed -i '' 's/minSdk 21/minSdk 23/' android/app/build.gradle
          
          echo "=== AFTER ==="
          cat android/local.properties
          cat android/app/build.gradle | grep -i minsdk
          
      - name: Get packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
