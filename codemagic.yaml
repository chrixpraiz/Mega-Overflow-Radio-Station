workflows:
  flutter-android:
    name: MOR - FINAL Icon + AdMob
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Fix + Build Icon
        script: |
          cp main.dart /tmp/my_main.dart || cp lib/main.dart /tmp/my_main.dart
          rm -rf android
          flutter create . --platforms=android --project-name megaoverflowradio
          cp /tmp/my_main.dart lib/main.dart
          mkdir -p assets/icon assets/images
          cp assets/icon/app_icon.png assets/icon/app_icon.png 2>/dev/null || true
          touch assets/images/.keep
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
          python3 << 'PY'
          import pathlib, re
          lp = pathlib.Path("android/local.properties")
          txt = lp.read_text()
          txt = re.sub(r'flutter\.minSdkVersion=.*', 'flutter.minSdkVersion=23', txt)
          if 'flutter.minSdkVersion' not in txt:
              txt += '\nflutter.minSdkVersion=23\n'
          lp.write_text(txt)
          bg = pathlib.Path("android/app/build.gradle")
          bgt = bg.read_text()
          bgt = bgt.replace('flutter.minSdkVersion', '23')
          bgt = re.sub(r'(minSdk[^0-9]*)\d+', r'\g<1>23', bgt)
          bg.write_text(bgt)
          PY
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "\"; then
            sed -i '' 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1383337037822798~9185411751"/> \n    </application>|' "\"
          fi
          ls -lh assets/icon/app_icon.png
          flutter pub get
          dart run flutter_launcher_icons || true
      - name: Get packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
