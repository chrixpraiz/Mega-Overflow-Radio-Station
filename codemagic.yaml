workflows:
  android-workflow:
    name: MOR Android Build
    instance_type: mac_mini_m2
    environment:
      flutter: 3.19.0
    scripts:
      - name: Build APK
        script: |
          flutter create . --platforms=android --project-name megaoverflow_radio
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
