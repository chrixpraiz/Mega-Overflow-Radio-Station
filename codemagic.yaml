workflows:
  flutter-android:
    name: MOR Flutter Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fix Flutter Structure
        script: |
          ls -la
          echo "=== pubspec.yaml ==="
          cat pubspec.yaml
          # Backup your main.dart
          cp main.dart /tmp/my_main.dart || cp lib/main.dart /tmp/my_main.dart
          # Create proper Flutter project - generates android folder
          flutter create . --platforms=android --project-name megaoverflowradio
          # Restore your code
          cp /tmp/my_main.dart lib/main.dart
          echo "=== Restored main.dart ==="
          ls -la android/app/
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --verbose
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
