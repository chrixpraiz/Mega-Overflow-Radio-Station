workflows:
  flutter-android:
    name: MOR Flutter Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Fix Structure + Gradle
        script: |
          cp main.dart /tmp/my_main.dart || cp lib/main.dart /tmp/my_main.dart
          flutter create . --platforms=android --project-name megaoverflowradio
          cp /tmp/my_main.dart lib/main.dart
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
      - name: Clean & Get
        script: |
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
